<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZynkOS — Neural OS & Arcade</title>
  <style>html, body { background: #04070b !important; color: #f8fafc; margin: 0; }</style>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com" defer></script>
</head>
<body>
  <!-- Startup Gate and OS Shell navigation structure (Refer to full source document for complete markup) -->
  <div id="auth-modal" class="startup-gate">...</div>
  <div class="os-shell">
    <aside class="left-dock" id="left-dock">
      <div class="dock-top">
        <div class="brand-logo">Z</div>
        <span class="brand-title">ZynkOS</span>
        <button class="collapse-btn" id="toggle-dock">☰</button>
      </div>
      <!-- Core, Social, and Access navigation buttons -->
    </aside>
    <main class="center-stage">
      <!-- Main dashboard, chat, arcade, ranks, store, profile, achievements, leaderboards, and settings views -->
      <section id="home-view" class="tab-view active">
        <div class="hero-stage">
          <canvas id="wireframe-bg"></canvas>
          <div class="hero-clock-overlay">
            <div class="hero-day" id="hero-day">SATURDAY</div>
            <div class="hero-time-row">
              <span class="hero-time" id="hero-time">7:53</span>
              <span class="hero-ampm" id="hero-ampm">PM</span>
            </div>
            <div class="hero-date" id="hero-date">11.21.26</div>
          </div>
        </div>
      </section>
      <!-- Additional views and footer scripts (Refer to full source document for complete markup) -->
    </main>
  </div>
  <script src="js/supabase.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/ranks-store.js" defer></script>
  <script src="js/admin-beta.js" defer></script>
  <script src="js/chat.js" defer></script>
  <script src="js/profile-ui.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/wireframe.js" defer></script>
</body>
</html>
